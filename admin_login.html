<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold text-amber-400 mb-2">Admin Portal Login</h2>
        <p class="text-xs text-slate-400 mb-6">Default: admin / admin123</p>
        
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition mt-4">
                Login as Admin
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white">← Back to Customer Home</a>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const savedAdminPass = localStorage.getItem('adminPass') || 'admin123';

            if(u === 'admin' && p === savedAdminPass) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = 'admin_dashboard.html';
            } else {
                alert('Incorrect ! Please Check');
            }
        }
    </script>
</body>
</html>
